name: Prompt Cohesion Audit

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  push:
    branches: [ development, master, transcript-canvas ]
    paths:
      - '.github/prompts/**'
      - '.github/instructions/**'
      - '.github/README_AI.md'
      - '.github/scripts/run-prompt-cohesion-audit.ps1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Prompt Cohesion Audit
        shell: pwsh
        run: |
          .\.github\scripts\run-prompt-cohesion-audit.ps1 -OutDir ".github/reports" -FailOnError

      - name: Upload Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: prompt-cohesion-audit
          path: .github/reports/*
