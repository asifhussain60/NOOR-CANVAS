name: Prompt Lint

on:
  pull_request:
    paths:
      - '.github/prompts/**'
      - '.github/instructions/**'
      - 'Workspaces/CodeQuality/prompt-linter.ps1'

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Prompt Linter
        shell: pwsh
        run: |
          ./Workspaces/CodeQuality/prompt-linter.ps1 -Root "$PWD"
